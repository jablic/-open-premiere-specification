name: Validate Knowledge Base

on:
  push:
    branches: [main]
    paths:
      - "Knowledge/**"
      - "Examples/**"
      - "tools/validate_frontmatter.py"
      - ".github/workflows/validate.yml"
      - "Sources/**"
      - "Consolidation/**"
      - "tools/audit_corpus.py"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install PyYAML pytest

      - name: Verify preserved corpus and catalog
        run: python tools/audit_corpus.py --check

      - name: Test structured tools
        working-directory: Sources/structured
        run: python -m pytest -q

      - name: Test Resolve fixtures
        working-directory: Sources/resolve
        run: python -m pytest -q

      - name: Validate Knowledge frontmatter
        run: python tools/validate_frontmatter.py

      - name: Count Knowledge docs and examples
        run: |
          printf 'Knowledge docs: '
          find Knowledge -maxdepth 1 -type f -name "*.md" | wc -l
          printf 'Examples: '
          find Examples -type f \( -name "*.jsx" -o -name "*.js" -o -name "*.py" \) | wc -l
